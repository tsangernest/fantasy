

services:
  db_main:
    image: postgres:18.6
    container_name: postgresql
    environment:
      POSTGRES_DB: "fantasy_main"
      POSTGRES_USER: "fantasyuser"
      POSTGRES_PASSWORD: "fantasypass"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: always

  web:
    tty: true
    stdin_open: true
    build:
      context: .
      args:
        DOCKER_BUILDKIT: 1
    container_name: fastapi
    ports:
      - "8000:8000"
    volumes:
     - .:/app
     - /app/.venv/
    depends_on:
      - db_main
#      db_main:
#        condition: service_healthy
    restart: always
    command: uv run uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload --loop uvloop
    # - The command is uvicorn path with dot notation colon, then the name of the application.
    #   In this case "app" is  from the last command "app = get_application()", from the file "/src/main.py/"

volumes:
  postgres_data:

